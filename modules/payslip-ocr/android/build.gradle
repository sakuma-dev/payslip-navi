plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.payslipocr'
version = '0.1.0'

android {
  namespace 'expo.modules.payslipocr'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Bundled Japanese model: no first-run model download.
  implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
}
